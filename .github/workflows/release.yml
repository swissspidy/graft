name: Release

# Publishes the npm packages (scripts/build-packages.ts) when a GitHub
# release is published. The release tag must be v<version>, the version
# every published package's package.json carries. npm authenticates the
# workflow through trusted publishing (OIDC): no token is stored, and the
# packages get provenance.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: The packages install and import outside the workspace
        run: pnpm test:packages
      - name: The release tag matches the packages' version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for dir in packages/core packages/a2ui; do
            version="v$(node -p "require('./$dir/package.json').version")"
            if [ "$version" != "$TAG" ]; then
              echo "::error::$dir is $version, the release is $TAG"
              exit 1
            fi
          done
      - name: Publish
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          # core first: a2ui depends on it.
          for dir in packages/core packages/a2ui; do
            (cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/packs/$(basename "$dir")")
            npm publish "$RUNNER_TEMP"/packs/"$(basename "$dir")"/*.tgz --access public --provenance
          done
