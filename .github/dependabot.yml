version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Give new releases a week before proposing them.
    cooldown:
      default-days: 7
    groups:
      # react and react-dom must be the exact same version (EmDash refuses to
      # start otherwise, and react-dom crashes on a different react), so they
      # and their types always move together, majors included. Listed first:
      # a dependency joins the first group it matches.
      react:
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
      # graft-a2ui builds the catalog the WordPress renderer (@swissspidy/a2ui-wp)
      # draws with, so both must resolve to the same @a2ui/web_core: a second
      # copy breaks the Catalog and DataContext types. a2ui-wp pins a 0.x minor
      # of web_core (^0.14.0), so a new web_core minor moves only with an
      # a2ui-wp release that allows it.
      a2ui:
        patterns: ['@a2ui/*', '@swissspidy/a2ui-wp']
      # Minor and patch updates in one PR; majors stay separate.
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # a2ui-wp 0.2 allows only ^0.14.0. Raise this bound with the a2ui-wp
      # release that widens its range, so both move in the a2ui group's PR.
      - dependency-name: '@a2ui/web_core'
        versions: ['>=0.15.0']
      # Component and function schemas are handed to @a2ui/web_core, which is on
      # zod 3; zod 4 schemas don't fit its types. Lift this once web_core moves.
      - dependency-name: zod
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
